<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Order Successful - Foodie</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fffaf5;
        }

        .success {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff5722;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            margin: 25px 0;
        }

        a {
            display: inline-block;
            background: #ff5722;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="success">

    <div class="icon">✅</div>

    <h1>Order Placed Successfully!</h1>

    <p>
        Thank you, {{ name }}!
    </p>

    <p>
        Your order has been received successfully.
    </p>

    <div class="total">
        Total Amount: ₹{{ order.total_amount }}
    </div>

    <a href="{% url 'home' %}">
        Continue Shopping 🍴
    </a>

</div>

</body>
</html>
