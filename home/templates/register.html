<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Foodie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

       body {
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(20, 20, 20, 0.45),
            rgba(20, 20, 20, 0.45)
        ),
        url("https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1920&q=85");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}


        /* Main Card */
        .register-wrapper {
            width: 850px;
            max-width: 100%;
            min-height: 500px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.10);
        }

        /* Left Food Section */
        .food-section {
            position: relative;
            min-height: 500px;
            overflow: hidden;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.25)
                ),
                url("https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=85");

            background-size: cover;
            background-position: center;
        }

        .food-overlay {
            position: absolute;
            inset: 0;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #ff7043;
        }

        .food-text {
            margin-bottom: 15px;
        }

        .food-text h1 {
            font-size: 34px;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .food-text p {
            font-size: 15px;
            line-height: 1.6;
            max-width: 300px;
            color: #f4f4f4;
        }

        /* Right Form */
        .form-section {
            padding: 42px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            font-size: 29px;
            color: #222;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Error */
        .error {
            background: #fff0f0;
            color: #d93025;
            border-left: 4px solid #d93025;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* Form Grid */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #999;
        }

        input {
            width: 100%;
            height: 43px;
            border: 1px solid #dedede;
            border-radius: 9px;
            padding: 0 12px 0 38px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fafafa;
        }

        input:focus {
            border-color: #ff7043;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.10);
        }

        /* Register Button */
        button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 10px;
            background: #ff5a36;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.25s;
            box-shadow: 0 7px 18px rgba(255, 90, 54, 0.22);
        }

        button:hover {
            background: #e94b2a;
            transform: translateY(-1px);
            box-shadow: 0 9px 22px rgba(255, 90, 54, 0.28);
        }

        /* Login */
        .login-text {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }

        .login-text a {
            color: #ff5722;
            text-decoration: none;
            font-weight: 700;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .register-wrapper {
                grid-template-columns: 1fr;
                width: 430px;
            }

            .food-section {
                min-height: 210px;
            }

            .food-overlay {
                padding: 25px;
            }

            .food-text h1 {
                font-size: 25px;
            }

            .food-text p {
                display: none;
            }

            .form-section {
                padding: 30px 25px;
            }
        }

        @media (max-width: 430px) {

            .input-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-section {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="register-wrapper">

        <!-- Food Delivery Image -->
        <div class="food-section">

            <div class="food-overlay">

                <div class="brand">
                    🍴 Food<span>ie</span>
                </div>

                <div class="food-text">
                    <h1>Good Food.<br>Good Mood.</h1>

                    <p>
                        Order your favourite meals online
                        and enjoy delicious food delivered
                        right to your doorstep.
                    </p>
                </div>

            </div>

        </div>


        <!-- Registration Form -->
        <div class="form-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join Foodie and start ordering your favourite food.
            </p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="input-row">

                    <div class="input-group">
                        <label>Username</label>

                        <div class="input-box">
                            <span>👤</span>
                            <input
                                type="text"
                                name="username"
                                placeholder="Username"
                                required
                            >
                        </div>
                    </div>


                    <div class="input-group">
                        <label>Email</label>

                        <div class="input-box">
                            <span>✉️</span>
                            <input
                                type="email"
                                name="email"
                                placeholder="Email address"
                                required
                            >
                        </div>
                    </div>

                </div>


                <div class="input-row">

                    <div class="input-group">
                        <label>Password</label>

                        <div class="input-box">
                            <span>🔒</span>
                            <input
                                type="password"
                                name="password"
                                placeholder="Password"
                                required
                            >
                        </div>
                    </div>


                    <div class="input-group">
                        <label>Confirm Password</label>

                        <div class="input-box">
                            <span>🔐</span>
                            <input
                                type="password"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required
                            >
                        </div>
                    </div>

                </div>


                <button type="submit">
                    Create Account →
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
