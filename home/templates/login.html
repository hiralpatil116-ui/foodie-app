<title>Login - Foodie</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background:
            linear-gradient(rgba(20, 12, 8, 0.55), rgba(20, 12, 8, 0.65)),
            url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    /* Main Card */
    .login-card {
        width: 100%;
        max-width: 430px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        padding: 40px 38px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        animation: cardAppear 0.7s ease;
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Logo */
    .logo {
        text-align: center;
        margin-bottom: 8px;
    }

    .logo-icon {
        width: 70px;
        height: 70px;
        margin: auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff5722, #ff8a50);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        box-shadow: 0 8px 20px rgba(255, 87, 34, 0.3);
    }

    .logo h1 {
        margin-top: 12px;
        color: #ff5722;
        font-size: 32px;
        letter-spacing: 1px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 30px;
    }

    /* Error Message */
    .error-message {
        background: #fff0ed;
        color: #d84315;
        border-left: 4px solid #ff5722;
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    /* Form */
    label {
        display: block;
        color: #333;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-box {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #ff5722;
    }

    input {
        width: 100%;
        height: 50px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 0 15px 0 45px;
        font-size: 15px;
        outline: none;
        background: #fff;
        transition: 0.3s;
    }

    input:focus {
        border-color: #ff5722;
        box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.12);
    }

    input::placeholder {
        color: #aaa;
    }

    /* Login Button */
    .login-btn {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #ff5722, #ff7043);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        box-shadow: 0 8px 20px rgba(255, 87, 34, 0.25);
        transition: 0.3s;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(255, 87, 34, 0.35);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    /* Register Section */
    .register-text {
        text-align: center;
        margin-top: 25px;
        color: #777;
        font-size: 14px;
    }

    .register-text a {
        color: #ff5722;
        text-decoration: none;
        font-weight: bold;
    }

    .register-text a:hover {
        text-decoration: underline;
    }

    /* Back to Home */
    .home-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #555;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
    }

    .home-link:hover {
        color: #ff5722;
    }

    /* Mobile */
    @media (max-width: 500px) {

        body {
            padding: 18px;
        }

        .login-card {
            padding: 32px 24px;
            border-radius: 20px;
        }

        .logo h1 {
            font-size: 28px;
        }
    }
</style>
```

</head>

<body>

```
<div class="login-card">

    <!-- Logo -->
    <div class="logo">
        <div class="logo-icon">🍴</div>
        <h1>Foodie</h1>
    </div>

    <p class="subtitle">
        Welcome back! Login to continue ordering.
    </p>

    <!-- Error -->
    {% if error %}
        <div class="error-message">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <!-- LOGIN FORM -->
    <form method="POST">
        {% csrf_token %}

        <div class="input-group">

            <label>Username</label>

            <div class="input-box">
                <span class="input-icon">👤</span>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

        </div>


        <div class="input-group">

            <label>Password</label>

            <div class="input-box">
                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

        </div>


        <button type="submit" class="login-btn">
            Login 🍕
        </button>

    </form>


    <!-- Register -->
    <div class="register-text">
        Don't have an account?
        <a href="{% url 'register' %}">Create Account</a>
    </div>


    <!-- Home -->
    <a href="{% url 'home' %}" class="home-link">
        ← Back to Foodie Home
    </a>

</div>
```

</body>
</html>
